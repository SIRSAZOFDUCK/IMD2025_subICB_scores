name: validate

# Each run recalculates the results from newly downloaded source files, compares
# the method with MHCLG's published averages, checks the source files, and
# confirms that the saved results can still be reproduced.
#
# NOTE: GitHub disables scheduled workflows in public repositories after ~60
# days without repository activity, so the monthly cron will stop firing on a
# quiet repo. The Actions tab shows a warning when that happens; re-enable it
# there, trigger a run manually (workflow_dispatch), or run the same checks
# locally (see README).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 1 * *'   # 06:00 UTC on the 1st of each month
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::readxl
            any::digest

      # data-raw/ is not stored in Git, so each run downloads current copies
      # from MHCLG and ONS and can detect a revised source file.
      - name: Calculate Sub-ICB scores and population measures
        run: |
          Rscript R/02_calculate_subicb_scores.R
          Rscript R/03_calculate_population_denominators.R

      # These calculations are used only for comparison with MHCLG's published
      # ICB and local authority averages. See the README for details.
      - name: Compare with MHCLG published averages
        run: |
          Rscript R/04_check_icb_scores.R
          Rscript R/05_check_local_authority_scores.R

      # This also runs after an earlier failure so a revised or missing source
      # file is reported clearly.
      - name: Check source files
        id: integrity
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: Rscript R/06_record_source_files.R --check

      - name: Report source file problem
        if: ${{ !cancelled() && steps.integrity.outcome == 'failure' }}
        run: |
          echo "::warning::Source file check failed - a file is"
          echo "missing (an earlier step died before downloading it) or its"
          echo "SHA-256 no longer matches the committed log (a publisher may"
          echo "have reissued data). Read the source-file step's output above;"
          echo "if a SHA-256 hash changed, regenerate the record with 'Rscript"
          echo "R/06_record_source_files.R' and repeat the comparisons before trusting"
          echo "the results."
          exit 1

      # Small differences in the final decimal places can occur between
      # computers, so the comparison uses a strict numerical tolerance.
      - name: Confirm saved results can be reproduced
        run: Rscript R/07_check_saved_results.R
